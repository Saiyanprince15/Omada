services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: omada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - omada-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/omada
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: replace-me-with-a-long-random-secret
      JWT_REFRESH_SECRET: replace-me-with-a-different-long-random-secret
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/v1
        VITE_WS_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  omada-postgres:
